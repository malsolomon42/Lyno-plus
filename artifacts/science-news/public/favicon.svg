<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#1b2d5a"/>
      <stop offset="55%"  stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#050710"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet1" cx="30%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <radialGradient id="planet2" cx="30%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="50%"  stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur10" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur18" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <style>
    @keyframes cw-fast   { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
    @keyframes ccw-mid   { from { transform: rotate(0deg);   } to { transform: rotate(-360deg); } }
    @keyframes cw-slow   { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
    @keyframes pulse-core {
      0%, 100% { opacity: 0.5; r: 44px; }
      50%       { opacity: 1;   r: 56px; }
    }
    @keyframes pulse-bloom {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.6;  }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.85; }
      50%       { opacity: 1;    }
    }

    .ring1 { transform-origin: 90px 90px; animation: cw-fast  4s   linear       infinite; }
    .ring2 { transform-origin: 90px 90px; animation: ccw-mid  7.5s linear       infinite; }
    .ring3 { transform-origin: 90px 90px; animation: cw-slow  13s  linear       infinite; }
    .core  {                              animation: pulse-core  2.6s ease-in-out infinite; }
    .bloom {                              animation: pulse-bloom 2.6s ease-in-out infinite; }
    .text  {                              animation: shimmer     2.6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- Outer bloom (very blurred) -->
  <circle class="bloom" cx="90" cy="90" r="70" fill="#3b82f6" filter="url(#blur18)" opacity="0.35"/>

  <!-- ── Ring 1: fast, outer, dashed + bright planet ── -->
  <g class="ring1">
    <circle cx="90" cy="90" r="78"
            stroke="#60a5fa" stroke-width="2.5"
            stroke-dasharray="12 26" fill="none" opacity="0.55"/>
    <!-- Planet halo -->
    <circle cx="90" cy="12" r="14" fill="#3b82f6" filter="url(#blur10)" opacity="0.7"/>
    <!-- Planet body -->
    <circle cx="90" cy="12" r="10" fill="url(#planet1)"/>
    <!-- Specular highlight -->
    <circle cx="86" cy="9"  r="3.5" fill="white" fill-opacity="0.5"/>
  </g>

  <!-- ── Ring 2: mid-speed, CCW, inner dashed + violet dot ── -->
  <g class="ring2">
    <circle cx="90" cy="90" r="52"
            stroke="#818cf8" stroke-width="2"
            stroke-dasharray="7 18" fill="none" opacity="0.45"/>
    <!-- Planet halo -->
    <circle cx="90" cy="38" r="10" fill="#7c3aed" filter="url(#blur4)" opacity="0.65"/>
    <!-- Planet body -->
    <circle cx="90" cy="38" r="7" fill="url(#planet2)"/>
    <circle cx="87" cy="36" r="2.5" fill="white" fill-opacity="0.45"/>
  </g>

  <!-- ── Ring 3: slow, tiny micro-dot ── -->
  <g class="ring3">
    <circle cx="90" cy="90" r="32"
            stroke="#38bdf8" stroke-width="1.2"
            stroke-dasharray="4 12" fill="none" opacity="0.3"/>
    <circle cx="90" cy="58" r="4" fill="#7dd3fc" opacity="0.85"/>
  </g>

  <!-- ── Pulsing core glow ── -->
  <circle class="core" cx="90" cy="90" r="44" fill="url(#core)"/>

  <!-- Centre dark backing -->
  <circle cx="90" cy="90" r="34" fill="#050710" fill-opacity="0.97"/>
  <circle cx="90" cy="90" r="34" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.45"/>

  <!-- "L+" text -->
  <text
    class="text"
    x="90" y="90"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Courier New', Courier, monospace"
    font-size="50"
    font-weight="900"
    fill="url(#tg)"
    letter-spacing="-2"
  >L+</text>

  <!-- Subtle corner star specks -->
  <circle cx="24"  cy="24"  r="1.5" fill="#93c5fd" opacity="0.6"/>
  <circle cx="156" cy="30"  r="1"   fill="#c4b5fd" opacity="0.5"/>
  <circle cx="18"  cy="150" r="1.2" fill="#7dd3fc" opacity="0.4"/>
  <circle cx="155" cy="152" r="1.8" fill="#93c5fd" opacity="0.55"/>
  <circle cx="45"  cy="160" r="1"   fill="#c4b5fd" opacity="0.35"/>
</svg>
